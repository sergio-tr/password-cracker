name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# API matrix (from gradle/libs.versions.toml):
#   minSdk=26, targetSdk=35, compileSdk=35
# A — API 29: near-minimum, KVM-stable on ubuntu-latest (API 26 images are fragile/slow).
# B — API 35: matches targetSdk / compileSdk.
# Both jobs run in parallel after JVM validation.

jobs:
  jvm:
    name: JVM / KMP validation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Legacy `tools` package was removed from the SDK repo; do not rely on action defaults.
          packages: platform-tools

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint (ktlint)
        run: ./gradlew ktlintCheck --stacktrace

      - name: Unit tests (JVM / KMP)
        run: ./gradlew test jvmTest --stacktrace

      - name: Assemble debug + compile androidTest
        run: ./gradlew :androidApp:assembleDebug :androidApp:compileDebugAndroidTestKotlin --stacktrace

      - name: Upload JVM test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  android-emulator:
    name: Android emulator (API ${{ matrix.api-level }})
    needs: jvm
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 29
            arch: x86_64
            target: google_apis
          - api-level: 35
            arch: x86_64
            target: google_apis
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Legacy `tools` package was removed from the SDK repo; do not rely on action defaults.
          packages: platform-tools

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connectedDebugAndroidTest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target }}
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            mkdir -p androidApp/build/ci
            date -u +%Y-%m-%dT%H:%M:%SZ > androidApp/build/ci/boot-ready.txt
            ./gradlew :androidApp:connectedDebugAndroidTest --stacktrace
            date -u +%Y-%m-%dT%H:%M:%SZ > androidApp/build/ci/androidTest-finished.txt
            adb logcat -d > androidApp/build/ci/logcat-raw.txt || true
            sh .github/scripts/sanitize-logcat.sh androidApp/build/ci/logcat-raw.txt androidApp/build/ci/logcat-sanitized.txt || true
            rm -f androidApp/build/ci/logcat-raw.txt

      - name: Upload androidTest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androidTest-api-${{ matrix.api-level }}
          path: |
            androidApp/build/reports/androidTests/
            androidApp/build/outputs/androidTest-results/
            androidApp/build/outputs/connected_android_test_additional_output/
            androidApp/build/ci/
          if-no-files-found: warn
          retention-days: 14
